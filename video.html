<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Memory · Films</title>
<link rel="stylesheet" href="https://thememory-1482718043.cos.ap-shanghai.myqcloud.com/assets/css/style.css?v=21">
</head>
<body>

<section class="vpage">
  <div class="vwrap">
    <div class="vplayer">
      <div class="vstage"></div>
      <button class="vnav vprev" aria-label="上一个">‹</button>
      <button class="vnav vnext" aria-label="下一个">›</button>
      <div class="vcount"></div>
    </div>
    <div class="vside">
      <div class="vside-inner">
        <div class="vside-eyebrow">Films</div>
        <div class="vside-sub"></div>
        <div class="vside-title"></div>
        <div class="vside-desc"></div>
      </div>
      <div class="vclose">✕ Close</div>
    </div>
  </div>
</section>

<hr class="section-divider">

<section class="film-section chapter" id="films">
  <div class="chapter-head reveal">
    <div class="eyebrow">Film Archive</div>
    <h2 class="serif-title">会动的记忆 · film</h2>
  </div>
  <div class="film-intro reveal" id="film-intro"></div>
  <div class="film-list reveal" id="film-list"></div>
</section>

<footer>The Memory · 记忆切片</footer>

<script>
/* 核心 JS 主用国内 COS（提速），失败回退 GitHub Pages 同源；两者均为 <script> 标签，不受 CORS 限制。
   数据 data.json 由 site.js 同源加载，彻底避开 COS 的 CORS 问题（这是之前整页崩溃的唯一原因）。 */
(function(){
  var s = document.createElement('script');
  s.src = 'https://thememory-1482718043.cos.ap-shanghai.myqcloud.com/assets/js/site.js?_=' + Date.now();
  s.onerror = function(){
    var f = document.createElement('script');
    f.src = 'assets/js/site.js?v=25';
    document.head.appendChild(f);
  };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
