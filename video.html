<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Memory · Films</title>
<link rel="stylesheet" href="assets/css/style.css?v=9">
</head>
<body>

<section class="vpage">
  <div class="vwrap">
    <div class="vplayer">
      <div class="vstage"></div>
      <button class="vnav vprev" aria-label="上一个">‹</button>
      <button class="vnav vnext" aria-label="下一个">›</button>
      <div class="vcount"></div>
    </div>
    <div class="vside">
      <div class="vside-inner">
        <div class="vside-eyebrow">Films</div>
        <div class="vside-sub"></div>
        <div class="vside-title"></div>
        <div class="vside-desc"></div>
      </div>
      <div class="vclose">✕ Close</div>
    </div>
  </div>
</section>

<script src="assets/js/site.js?v=9"></script>
</body>
</html>
