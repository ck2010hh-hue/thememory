<section class="chapter chapter-map" id="prov-map-sec">

  </div>
  <div class="map-panel prov-zoom-panel">
    <div class="zoom-controls">
      <button class="zoom-btn zoom-in" aria-label="放大">+</button>
      <button class="zoom-btn zoom-out" aria-label="缩小">−</button>
      <button class="zoom-btn zoom-reset" aria-label="重置">⟲</button>
    </div>
    <div class="mapwrap mapwrap-wide prov-map-wrap">
      <svg id="province-svg" viewBox="0 0 900 720" role="img" aria-label="省份地图"></svg>
    </div>
  </div>
</section>
